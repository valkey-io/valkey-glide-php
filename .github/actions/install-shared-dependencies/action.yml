name: Install shared software dependencies
description: "Install shared software dependencies like OS packages, Rust toolchain, and Valkey server."

inputs:
  os:
    description: "The current operating system"
    required: true
  target:
    description: "Specified target for rust toolchain, ex. x86_64-apple-darwin"
    required: false
    default: "x86_64-unknown-linux-gnu"
  engine-version:
    description: "Engine version to install"
    required: false
  github-token:
    description: "GITHUB_TOKEN, GitHub App installation access token"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install software dependencies for macOS
      shell: bash
      if: "${{ inputs.os == 'macos' }}"
      run: |
        brew update
        brew install openssl coreutils

    - name: Install software dependencies for Ubuntu GNU
      shell: bash
      if: "${{ inputs.os == 'ubuntu' && !contains(inputs.target, 'musl') }}"
      run: |
        sudo apt update -y
        sudo apt install -y git gcc pkg-config openssl libssl-dev

    - name: Install software dependencies for MUSL
      shell: bash
      if: "${{ contains(inputs.target, 'musl') }}"
      run: |
        apk update
        wget -O - https://sh.rustup.rs | sh -s -- -y
        source "$HOME/.cargo/env"
        apk add protobuf-dev musl-dev make gcc envsubst openssl libressl-dev py3-pip

    - name: Install software dependencies for Amazon-Linux
      shell: bash
      if: "${{ inputs.os == 'amazon-linux' }}"
      run: |
        yum install -y gcc pkgconfig openssl openssl-devel which curl gettext libasan tar --allowerasing

    # Shared actions from valkey-glide submodule
    - name: Install Rust toolchain and protoc
      if: "${{ !contains(inputs.target, 'musl') }}"
      uses: ./valkey-glide/.github/actions/install-rust-and-protoc
      with:
        target: ${{ inputs.target }}
        github-token: ${{ inputs.github-token }}

    - name: Install engine
      if: "${{ inputs.engine-version }}"
      uses: ./valkey-glide/.github/actions/install-engine
      with:
        engine-version: ${{ inputs.engine-version }}
        target: ${{ inputs.target }}

    # For valkey 9.0 on ubuntu, also start Docker containers with the
    # valkey-bundle image (includes modules: Search, JSON, Bloom, LDAP) on
    # dedicated ports. Regular tests use the source-built server; module
    # tests connect to these Docker containers via MODULES_STANDALONE_ENDPOINT
    # and MODULES_CLUSTER_ENDPOINTS env vars.
    - name: Start module servers via Docker (valkey 9.0, ubuntu)
      if: "${{ inputs.engine-version == '9.0' && inputs.os == 'ubuntu' }}"
      uses: ./valkey-glide/.github/actions/start-valkey-docker
      with:
        engine-version: ${{ inputs.engine-version }}

    - name: Install zig
      if: ${{ contains(inputs.target, 'linux-gnu') }}
      uses: ./valkey-glide/.github/actions/install-zig
      with:
        target: ${{ inputs.target }}
