name: Install macOS build dependencies
description: >-
  Install the Homebrew packages the PHP extension build needs on macOS. The build keeps macOS's own
  BSD tools, as a user's machine has.

runs:
  using: composite
  steps:
    - name: Install Homebrew packages
      shell: bash
      run: |
        brew install autoconf automake libtool pkg-config protobuf-c openssl
