---
name: "🐛 Bug Report"
description: Report a bug
title: "(topic): (short issue description)"
labels: [bug, needs-triage]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What is the problem? A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: |
        What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: |
        What actually happened?

        Please include full errors, uncaught exceptions, stack traces, and relevant logs.
        If service responses are relevant, please include wire logs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: |
        Provide a self-contained, concise snippet of code that can be used to reproduce the issue.
        For more complex issues provide a repo with the smallest sample that reproduces the bug.

        Avoid including business logic or unrelated code, it makes diagnosis more difficult.
        The code sample should be an SSCCE. See http://sscce.org/ for details. In short, please provide a code sample that we can copy/paste, run and reproduce.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: |
        Suggest a fix/reason for the bug
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Information/Context
      description: |
        Anything else that might be relevant for troubleshooting this bug. Providing context helps us come up with a solution that is most useful in the real world.
    validations:
      required: false

  - type: input
    id: client-version
    attributes:
      label: Client version used
    validations:
      required: true

  - type: input
    id: engine-version
    attributes:
      label: Engine type and version
      description: E.g. Valkey 7.0
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: OS
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Output of `php -v`, including thread safety (NTS/ZTS) if known. E.g. PHP 8.4.1 (NTS)
    validations:
      required: true

  - type: input
    id: build-environment
    attributes:
      label: Build environment (if relevant)
      description: |
        Only for build, install, or crash issues. Include the install method (PIE, PECL, source),
        compiler and version, and protobuf-c version. E.g. PIE, gcc 13.2, protobuf-c 1.4.1
    validations:
      required: false

  - type: textarea
    id: cluster-info
    attributes:
      label: Cluster information
      description: |
        Cluster information, cluster topology, number of shards, number of replicas, used data types.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Client and/or server logs.
    validations:
      required: false

  - type: textarea
    id: other
    attributes:
      label: Other information
      description: |
        e.g. detailed explanation, stacktraces, related issues, suggestions how to fix, links for us to have context, eg. associated pull-request, stackoverflow, etc
    validations:
      required: false
