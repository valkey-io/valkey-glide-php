name: Inquiry
description: Use this template for asking questions
title: "[Inquiry] "
labels: ["Inquiry"]
body:
  - type: textarea
    id: question-description
    attributes:
      label: Inquiry
      description: Describe your inquiry in detail
      placeholder: Describe your inquiry...
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP Version
      description: Optional - Specify your PHP version
      placeholder: e.g., 8.5.12

  - type: input
    id: engine-version
    attributes:
      label: Engine Version
      description: Optional - Specify the engine version
      placeholder: e.g., Valkey 8.0.1, Redis 6.2.14

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Optional - Specify the operating system
      placeholder: e.g., macOS 14, Ubuntu 20.04

  - type: textarea
    id: additional-info
    attributes:
      label: Additional Technical Information
      description: Optional - Provide any additional technical information
      placeholder: Additional context or details...
