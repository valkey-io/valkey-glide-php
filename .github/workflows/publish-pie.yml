name: Upload PIE source package

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  publish-pie:
    name: Build and upload PIE source package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Build PECL package
        # Reuses the PECL build action to produce the .tgz with resolved submodules.
        # PIE requires the same package content but with a different asset name
        # (php_valkey_glide-{VERSION}-src.tgz) on the GitHub Release.
        id: build-package
        uses: ./.github/workflows/build-pecl-package

      - name: Determine version and prerelease
        id: release-type
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Keep the full tag name as PIE expects the 'v' prefix in the asset name
          VERSION="${TAG}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if echo "$TAG" | grep -qE '(rc|alpha|beta)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release (if not exists)
        id: create-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.release-type.outputs.prerelease == 'true' }}
          generate_release_notes: false
          make_latest: false

      - name: Upload PIE source package
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ${{ steps.build-package.outputs.package-file }}
          asset_name: php_valkey_glide-${{ steps.release-type.outputs.version }}-src.tgz
          asset_content_type: application/gzip
