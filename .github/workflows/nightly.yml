name: PHP Full Matrix Tests (Nightly)

on:
  schedule:
    - cron: "0 9 * * *" # 9:00 UTC Everyday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-matrix-tests:
    # Scheduled runs only upstream, so forks don't run the full matrix every day.
    # Manual dispatch still works anywhere.
    if: github.repository == 'valkey-io/valkey-glide-php' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test.yml
    with:
      profile: full
